<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .blob{animation:float 9s ease-in-out infinite}
    .b2{animation-delay:-4s}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-12px)}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .bob{animation:bob 4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
</defs>
<rect width="1000" height="230" rx="18" fill="url(#bg)"/>
<rect width="1000" height="230" rx="18" fill="url(#grid)"/>
<circle class="blob" cx="860" cy="60" r="90" fill="#a78bfa" opacity=".18"/>
<circle class="blob b2" cx="760" cy="190" r="70" fill="#38bdf8" opacity=".16"/>
<circle class="blob" cx="950" cy="200" r="50" fill="#34d399" opacity=".14"/>
<g class="t">
  <text x="56" y="92" font-size="46" font-weight="800" fill="url(#tx)" class="fade d1">Abdalrhman Attar</text>
  <text x="58" y="132" font-size="21" font-weight="600" fill="#e6edf3" class="fade d2">Mobile &amp; Full-Stack Developer · Flutter</text>
  <text x="58" y="170" font-size="15" fill="#8b98a9" class="fade d3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">&gt; flutter · supabase · typescript · docker · claude code<tspan class="cursor" fill="#38bdf8"> ▍</tspan></text>
  <text x="58" y="200" font-size="13" fill="#8b98a9" class="fade d3">📍 Amman, Jordan</text>
</g>
<g transform="translate(700,40)" opacity=".9"><g class="bob">
  <rect x="0" y="0" width="92" height="150" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="34" y="8" width="24" height="5" rx="2.5" fill="#334155"/>
  <rect x="10" y="24" width="72" height="18" rx="5" fill="#38bdf8" opacity=".85"/>
  <rect x="10" y="50" width="33" height="33" rx="8" fill="#a78bfa" opacity=".85"/>
  <rect x="49" y="50" width="33" height="33" rx="8" fill="#34d399" opacity=".85"/>
  <rect x="10" y="91" width="72" height="8" rx="4" fill="#475569"/>
  <rect x="10" y="105" width="52" height="8" rx="4" fill="#334155"/>
  <rect x="10" y="124" width="72" height="16" rx="8" fill="url(#tx)"/>
</g></g>
</svg>